spring:
  application:
    name: gringotts-sync
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kyntus_dw}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 12
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      keepalive-time: 60000
  task:
    scheduling:
      pool:
        size: 4   # AutoPilot, rattrapage d'extraction et purge du journal en parallèle
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc.batch_size: 400
        order_inserts: true
        order_updates: true
        jdbc.batch_versioned_data: true
jackson:
  property-naming-strategy: SNAKE_CASE

kyntus:
  php-api:
    base-url: ${KYNTUS_PHP_API_BASE_URL:https://bytel.kyntus.fr}
    sync-key: ${KYNTUS_PHP_API_SYNC_KEY:KYNTUS_SUPER_SECRET_SYNC_KEY_2026_!@#}

  # 🤖 AutoPilot : 3 phases par période (Collecte → Enrichissement → Vérification) dans un périmètre
  autopilot:
    enabled: ${KYNTUS_AUTOPILOT_ENABLED:true}
    scope-mode: ${KYNTUS_SCOPE_MODE:CURRENT_YEAR}          # CURRENT_YEAR | LAST_12 | CUSTOM (modifiable depuis l'UI)
    scope-start: ${KYNTUS_SCOPE_START:2026_M01}            # utilisé si CUSTOM
    refresh-current-minutes: ${KYNTUS_REFRESH_CURRENT_MIN:60}   # mois courant : re-collecte complète
    refresh-previous-hours: ${KYNTUS_REFRESH_PREVIOUS_H:6}      # mois précédent
    refresh-closed-hours: ${KYNTUS_REFRESH_CLOSED_H:168}        # mois clos (0 = jamais, seulement vérifiés)
    verify-hours: ${KYNTUS_VERIFY_H:6}                          # vérification légère (1 appel Bytel / période)
    healer-mode: RADAR
    tick-ms: 30000
    initial-delay-ms: 30000

  events:
    retention-days: 14

  # 🛡️ Protection serveur Bytel (adaptatif, partagé Time Machine + Healer)
  throttle:
    min-delay-ms: ${KYNTUS_THROTTLE_MIN_DELAY_MS:250}   # vitesse max : 1 requête / 250ms
    max-delay-ms: 15000
    max-in-flight: ${KYNTUS_THROTTLE_MAX_IN_FLIGHT:4}    # requêtes simultanées max vers Bytel
    slow-response-ms: 25000                              # réponse plus lente => on freine
    block-pause-ms: 900000                               # 403 Akamai => pause 15 min
    breaker-pause-ms: 120000                             # N erreurs d'affilée => pause 2 min
    breaker-threshold: 6

  healer:
    chunk-size: 200
    batch-size: 10
    max-attempts: ${KYNTUS_HEALER_MAX_ATTEMPTS:5}   # essais (espacés 30m → 48h) avant de classer un EPS "sans détail définitif"
