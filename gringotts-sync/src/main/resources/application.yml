spring:
  application:
    name: gringotts-sync
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kyntus_dw}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # 🚀 L'FIX HNA : Bulk Inserts/Updates bach Postgres ykhdem b zerba khayaliya
        jdbc.batch_size: 400
        order_inserts: true
        order_updates: true
        jdbc.batch_versioned_data: true
  jackson:
    property-naming-strategy: SNAKE_CASE

kyntus:
  php-api:
    base-url: ${KYNTUS_PHP_API_BASE_URL:https://bytel.kyntus.fr}
    sync-key: ${KYNTUS_PHP_API_SYNC_KEY:KYNTUS_SUPER_SECRET_SYNC_KEY_2026_!@#}