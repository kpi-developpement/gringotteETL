spring:
  application:
    name: gringotts-sync
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kyntus_dw}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 12
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      keepalive-time: 60000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc.batch_size: 400
        order_inserts: true
        order_updates: true
        jdbc.batch_versioned_data: true
jackson:
  property-naming-strategy: SNAKE_CASE

kyntus:
  php-api:
    base-url: ${KYNTUS_PHP_API_BASE_URL:https://bytel.kyntus.fr}
    sync-key: ${KYNTUS_PHP_API_SYNC_KEY:KYNTUS_SUPER_SECRET_SYNC_KEY_2026_!@#}

  # 🤖 AutoPilot : boucle infinie sur toutes les périodes
  autopilot:
    enabled: ${KYNTUS_AUTOPILOT_ENABLED:true}
    start-period: ${KYNTUS_AUTOPILOT_START_PERIOD:2024_M01}      # 1ère période de la boucle (jusqu'au mois courant)
    current-refresh-minutes: ${KYNTUS_AUTOPILOT_REFRESH_MIN:60}  # mois courant ré-inséré en tête de file
    pass-gap-minutes: ${KYNTUS_AUTOPILOT_PASS_GAP_MIN:2}         # pause entre deux passes complètes
    phantom-retry-hours: 6                                       # remet les EPS "{}" au Healer
    healer-mode: RADAR
    extra-periods: ${KYNTUS_AUTOPILOT_EXTRA_PERIODS:}            # ex: 2023_M12
    tick-ms: 30000
    initial-delay-ms: 30000

  events:
    retention-days: 14

  # 🛡️ Protection serveur Bytel (adaptatif, partagé Time Machine + Healer)
  throttle:
    min-delay-ms: ${KYNTUS_THROTTLE_MIN_DELAY_MS:250}   # vitesse max : 1 requête / 250ms
    max-delay-ms: 15000
    max-in-flight: ${KYNTUS_THROTTLE_MAX_IN_FLIGHT:4}    # requêtes simultanées max vers Bytel
    slow-response-ms: 25000                              # réponse plus lente => on freine
    block-pause-ms: 900000                               # 403 Akamai => pause 15 min
    breaker-pause-ms: 120000                             # N erreurs d'affilée => pause 2 min
    breaker-threshold: 6

  healer:
    chunk-size: 200
    batch-size: 10
